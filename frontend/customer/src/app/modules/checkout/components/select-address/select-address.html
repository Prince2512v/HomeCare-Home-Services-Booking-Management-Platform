<div class="card border-1 rounded-3 shadow-sm sa-border">
  <div class="card-body p-3 p-md-4">
    @if (isLoggedIn && !selectedAddress) {
    <h6 class="fw-bold mb-3 sa-title">Address</h6>
    <button
      type="button"
      class="btn rounded-pill fw-semibold text-white px-4 py-2 sa-btn-select"
      (click)="openModal()"
    >
      Select Address
    </button>

    } @else if (selectedAddress) {
    <div class="d-flex align-items-center justify-content-between gap-3">
      <div class="overflow-hidden">
        <h6 class="fw-bold mb-1 sa-title">Address</h6>
        <p class="mb-0 text-secondary small text-truncate">
          {{ formatDisplayAddress(selectedAddress) }}, {{
          selectedAddress.fullAddress }}
        </p>
      </div>
      <button
        type="button"
        class="btn rounded-pill fw-semibold flex-shrink-0 sa-btn-edit"
        (click)="openModal()"
      >
        Edit
      </button>
    </div>

    } @else {
    <h6 class="fw-bold mb-0 sa-title text-muted">Address</h6>
    }
  </div>
</div>

@if (showModal) {
<app-select-address-modal
  (close)="showModal = false"
  (selected)="onAddressSelected($event)"
/>
}
