<div class="card border-1 rounded-3 shadow-sm ss-border">
  <div class="card-body p-3 p-md-4">
    @if (selectedSlot) {
    <div class="d-flex align-items-center justify-content-between gap-3">
      <div class="overflow-hidden">
        <h6 class="fw-bold mb-1 ss-title">Slot</h6>
        <p class="mb-0 text-secondary small">
          {{ formatDate(selectedSlot.bookingDate) }}, {{ formatTime(selectedSlot.bookingTime) }}
        </p>
      </div>
      <button
        type="button"
        class="btn rounded-pill fw-semibold flex-shrink-0 ss-btn-edit"
        (click)="openModal()"
      >
        Edit
      </button>
    </div>
    } @else if (isAddressDone) {
    <h6 class="fw-bold mb-3 ss-title">Slot</h6>
    <button
      type="button"
      class="btn rounded-pill fw-semibold text-white px-4 py-2 ss-btn-book"
      (click)="openModal()"
    >
      Book Slot
    </button>
    } @else {
    <h6 class="fw-bold mb-0 ss-title text-muted">Slot</h6>
    }
  </div>
</div>

@if (showModal) {
<app-book-slot-modal
  [initialDate]="selectedSlot?.bookingDate ?? null"
  [initialTime]="selectedSlot?.bookingTime ?? null"
  [serviceId]="serviceId"
  [serviceTypeId]="serviceTypeId"
  (close)="onModalClose()"
  (saved)="onSaved($event)"
/>
}
