<div class="card border-1 rounded-3 shadow-sm sp-border">
  <div class="card-body p-3 p-md-4">
    @if (selectedMethod) {
    <div class="d-flex align-items-center justify-content-between gap-3">
      <div>
        <h6 class="fw-bold mb-1 sp-title">Payment Method</h6>
        <p class="mb-0 text-secondary small">{{ selectedMethod }}</p>
      </div>
      <button
        type="button"
        class="btn rounded-pill fw-semibold flex-shrink-0 sp-btn-edit"
        (click)="openModal()"
      >
        Edit
      </button>
    </div>
    } @else if (isSlotDone) {
    <h6 class="fw-bold mb-2 sp-title">Payment Method</h6>
    <button
      type="button"
      class="btn rounded-pill fw-semibold text-white px-4 py-2 sp-btn-select"
      (click)="openModal()"
    >
      Select Payment Method
    </button>
    } @else {
    <h6 class="fw-bold mb-0 sp-title text-muted">Payment Method</h6>
    }
  </div>
</div>

@if (showModal) {
<app-common-modal title="Select Payment Method" maxWidth="400px" (close)="showModal = false">
  <div class="d-flex gap-3 flex-wrap mb-4">
    @for (method of methods; track method) {
    <button
      type="button"
      class="sp-method-pill btn rounded-pill fw-semibold"
      [class.sp-method-pill--active]="isSelected(method)"
      (click)="selectMethod(method)"
    >
      {{ method }}
    </button>
    }
  </div>
  <div class="d-flex justify-content-end gap-3">
    <button
      type="button"
      class="btn rounded-pill px-4 py-2 fw-semibold sp-btn-cancel"
      (click)="showModal = false"
    >
      Cancel
    </button>
    <button
      type="button"
      class="btn rounded-pill px-4 py-2 fw-semibold text-white sp-btn-save"
      [disabled]="!canSave"
      (click)="save()"
    >
      Save
    </button>
  </div>
</app-common-modal>
}
