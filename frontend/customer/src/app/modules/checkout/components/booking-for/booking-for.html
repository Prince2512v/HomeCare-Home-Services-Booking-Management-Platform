<div class="card border-1 rounded-3 shadow-sm bf-border">
  <div class="card-body p-3 p-md-4">
    <h6 class="fw-bold mb-2 bf-title">Booking For</h6>

    @if (currentUser) {
    <p class="mb-0 text-secondary small">{{ currentUser.email }}</p>
    } @else {
    <button
      type="button"
      class="btn rounded-pill fw-semibold text-white px-4 py-2 mt-1 bf-btn"
      (click)="openSignIn()"
    >
      Sign In
    </button>
    }
  </div>
</div>

@if (authStep === 'sign-in') {
<app-sign-in-modal (close)="closeModal()" (otpSent)="onOtpSent($event)" />
} @if (authStep === 'otp') {
<app-otp-modal
  [email]="pendingEmail"
  [name]="pendingName"
  (close)="closeModal()"
  (verified)="onVerified()"
/>
}
