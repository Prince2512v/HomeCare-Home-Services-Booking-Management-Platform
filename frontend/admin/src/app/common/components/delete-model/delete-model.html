@if (visible) {
<div class="modal fade show d-block">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          {{ config.title }}
        </h5>
        <button class="btn-close" (click)="onCancel()"></button>
      </div>

      <div class="modal-body">
        {{ config.message }}
      </div>

      <div class="modal-footer gap-1 modal-footer-center">
        <app-button [config]="cancelConfig" class="btn-half-width"></app-button>
        <app-button [config]="deleteConfig" class="btn-half-width"></app-button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop fade show"></div>
}
