@if (isOpen) {
<div class="modal-overlay d-flex align-items-center justify-content-center" (click)="closeModal()">
  <div
    class="bg-white rounded-4 shadow p-4 modal-box"
    style="width: 420px"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h5 class="fw-bold mb-0">{{ title }}</h5>
      <button type="button" class="btn-close" (click)="closeModal()"></button>
    </div>

    <form [formGroup]="serviceTypeForm" (ngSubmit)="handleSave()">
      <app-name-field [config]="nameConfig" [formGroup]="serviceTypeForm"></app-name-field>

      <div class="mb-4">
        <input
          type="file"
          #fileInput
          (click)="$event.stopPropagation()"
          (change)="onFileSelected($event)"
          accept=".svg,.png,.jpg,.jpeg"
          class="d-none"
        />
        <button
          type="button"
          class="btn btn-light fw-semibold uploadbtn"
          (click)="fileInput.click()"
        >
          <img
            src="/assets/icons/upload.svg"
            alt="Upload icon"
            width="20"
            height="20"
            class="me-2"
          />Upload icon
        </button>
        @if (uploadedFileName) {
        <div class="text-dark small fw-bold mt-1">
          {{ uploadedFileName }}
        </div>
        }
        <p class="text-muted small mt-2 mb-0">Icon size must be less than 5MB.</p>
      </div>

      <div class="d-flex gap-3 model-popup">
        <app-button [config]="cancelConfig" class="btn-modal-half"></app-button>
        <app-button [config]="saveConfig" class="btn-modal-half"></app-button>
      </div>
    </form>
  </div>
</div>
}
