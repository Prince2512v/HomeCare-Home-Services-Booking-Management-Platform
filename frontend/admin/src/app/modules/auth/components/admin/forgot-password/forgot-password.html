<div class="container-fluid vh-100">
  <div class="row h-100">
    <div class="col-md-7 d-flex align-items-center justify-content-center bg-light">
      <div class="auth-card text-center">

        <div class="logo-title mb-4">
          <h3>H<span>o</span>meCare</h3>
        </div>

        <p class="signin-title mb-2">Forgot Password?</p>
        <p class="text-muted small mb-4">Enter your registered email to receive a reset link</p>

        <form [formGroup]="forgetForm" (ngSubmit)="onSubmit()" novalidate>
          <div class="mb-4">
            <app-email [config]="emailConfig"></app-email>
          </div>

          <button
            type="submit"
            class="btn btn-primary w-100 py-3 fw-semibold rounded-3"
            [disabled]="isLoading"
          >
            @if (isLoading) {
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>

            } Send Reset Link
          </button>

          <div class="mt-4 text-center small text-muted">
            Remember your password?
            <a class="signin-link ms-1" (click)="onSignIn()">Sign In</a>
          </div>
        </form>

      </div>
    </div>

    <div class="col-md-5 d-none d-md-block p-0">
      <img
        src="assets/images/auth/home.svg"
        alt="Healthcare illustration"
        class="img-fluid h-100 w-100 object-fit-cover right-image"
      />
    </div>
  </div>
</div>
