@if (visible) {
<div class="modal-overlay d-flex align-items-center justify-content-center">
    <div class="bg-white rounded-4 shadow p-4 modal-box" style="width: 420px">
      
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="fw-bold mb-0">{{ title }}</h5>
              <button type="button" class="btn-close btn p-0" (click)="closeModal()">
      </button>
      </div>
  
      <!-- Body -->
      <form [formGroup]="formGroup" (ngSubmit)="save()" appRequiredField>
        <app-name-field [config]="nameConfig" [formGroup]="formGroup"></app-name-field>
  
        <!-- Footer buttons -->
        <div class="d-flex gap-3 mt-2">
            <app-button [config]="cancelConfig" class="btn-close-cancel"></app-button>
            <app-button [config]="saveConfig" class="btn-save"></app-button>
        </div>
      </form>
    </div>
  </div>
}
